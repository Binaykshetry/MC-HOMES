name: Build ButtonHome Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          if [ -d "ButtonHome" ]; then
            echo "Found ButtonHome directory, building inside ButtonHome..."
            cd ButtonHome
            mvn clean package
          else
            echo "ButtonHome directory not found, building at repository root..."
            mvn clean package
          fi

      - name: Upload Plugin Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ButtonHome-Plugin
          path: |
            ButtonHome/target/*.jar
            target/*.jar
